<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美羊AI解析助手 - 学习力综合测评分析</title>
    <!-- Element Plus CSS -->
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
    <!-- ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- Element Plus JS -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://unpkg.com/element-plus/dist/index.full.min.js"></script>

    <style>
        :root {
            --dark-header: #304156;
            --primary: #409EFF;
            --success: #67c23a;
            --warning: #e6a23c;
            --danger: #f56c6c;
            --bg: #f0f2f5;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;
            background: var(--bg);
            min-height: 100vh;
        }

        /* 顶栏 */
        .app-header {
            background: var(--dark-header);
            color: #fff;
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,.15);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .app-header .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .app-header .logo-img {
            height: 40px;
            width: auto;
            object-fit: contain;
        }



        /* 主体 */
        .app-main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        /* 卡片 */
        .card {
            background: #fff;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 1px 4px rgba(0,0,0,.08);
        }
        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #303133;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 18px;
            background: var(--primary);
            border-radius: 2px;
        }

        /* 上传区 */
        .upload-section {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .upload-box {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            border: 2px dashed #d9d9d9;
            border-radius: 8px;
            padding: 32px 20px;
            text-align: center;
            cursor: pointer;
            transition: all .3s;
            background: #fafafa;
        }
        .upload-box:hover {
            border-color: var(--primary);
            background: #ecf5ff;
        }
        .upload-box.has-file {
            border-color: var(--success);
            background: #f0f9eb;
            border-style: solid;
        }
        .upload-box .icon {
            font-size: 40px;
            color: #c0c4cc;
            margin-bottom: 12px;
        }
        .upload-box:hover .icon { color: var(--primary); }
        .upload-box.has-file .icon { color: var(--success); }
        .upload-box .text {
            font-size: 14px;
            color: #909399;
        }
        .upload-box .file-name {
            font-size: 13px;
            color: var(--success);
            margin-top: 8px;
            font-weight: 500;
        }

        /* 概览统计 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
            gap: 16px;
        }
        .stat-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #fff 100%);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            border: 1px solid #ebeef5;
        }
        .stat-card.clickable {
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .stat-card.clickable:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0,0,0,.1);
            border-color: #c0c4cc;
        }

        /* 综合总结 */
        .summary-card {
            background: linear-gradient(135deg, #f0f5ff 0%, #f6ffed 100%);
            border-radius: 8px;
            padding: 24px 28px;
            border: 1px solid #d9ecff;
            line-height: 1.9;
            font-size: 15px;
            color: #303133;
        }
        .summary-card .summary-title {
            font-size: 16px;
            font-weight: 700;
            color: #409EFF;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .summary-card .summary-title:before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 18px;
            background: linear-gradient(180deg, #409EFF, #67c23a);
            border-radius: 2px;
        }

        /* 返回顶部 */
        .back-to-top {
            position: fixed;
            bottom: 48px;
            right: 36px;
            width: 44px;
            height: 44px;
            background: var(--primary);
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 12px rgba(64,158,255,.35);
            transition: all .3s ease;
            z-index: 999;
            font-size: 22px;
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
        }
        .back-to-top.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .back-to-top:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 18px rgba(64,158,255,.5);
            background: #3a8ee6;
        }
        .stat-card .num {
            font-size: 36px;
            font-weight: 700;
            line-height: 1.2;
        }
        .stat-card .label {
            font-size: 13px;
            color: #909399;
            margin-top: 4px;
        }
        .stat-card.danger .num { color: var(--danger); }
        .stat-card.warning .num { color: var(--warning); }
        .stat-card.success .num { color: var(--success); }
        .stat-card.primary .num { color: var(--primary); }

        /* 维度标签 */
        .tag-urgent {
            background: #fef0f0;
            color: #f56c6c;
            border: 1px solid #fbc4c4;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        .tag-improve {
            background: #fdf6ec;
            color: #e6a23c;
            border: 1px solid #f5dab1;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        .tag-good {
            background: #f0f9eb;
            color: #67c23a;
            border: 1px solid #c2e7b0;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        /* 维度表格 */
        .dim-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .dim-table th {
            background: #f5f7fa;
            color: #303133;
            font-weight: 600;
            padding: 10px 12px;
            text-align: left;
            border-bottom: 2px solid #ebeef5;
            white-space: nowrap;
        }
        .dim-table th.sortable {
            cursor: pointer;
            user-select: none;
            transition: color 0.2s;
        }
        .dim-table th.sortable:hover {
            color: #6366F1;
        }
        .dim-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #ebeef5;
        }
        .dim-table tr:hover { background: #f5f7fa; }
        .dim-table .score-bar {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dim-table .bar-bg {
            flex: 1;
            height: 8px;
            background: #ebeef5;
            border-radius: 4px;
            overflow: hidden;
            min-width: 60px;
        }
        .dim-table .bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width .6s ease;
        }
        .dim-table .bar-fill.urgent { background: var(--danger); }
        .dim-table .bar-fill.improve { background: var(--warning); }
        .dim-table .bar-fill.good { background: var(--success); }

        /* 图表区 */
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .chart-box {
            background: #fff;
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,.08);
            animation: chartSlideIn 0.6s ease both;
        }
        @keyframes chartSlideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .chart-box.full { grid-column: 1 / -1; }
        .chart-box .chart-inner {
            width: 100%;
            height: 420px;
        }
        .chart-box .chart-inner.tall { height: 500px; }

        /* 建议卡片 */
        .advice-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px,1fr));
            gap: 14px;
        }
        .advice-card {
            border-radius: 8px;
            padding: 16px 18px;
            border-left: 4px solid;
        }
        .advice-card.urgent { border-left-color: var(--danger); background: #fef0f0; }
        .advice-card.improve { border-left-color: var(--warning); background: #fdf6ec; }
        .advice-card.good { border-left-color: var(--success); background: #f0f9eb; }

        .advice-card .advice-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .advice-card .advice-dim {
            font-size: 15px;
            font-weight: 700;
            color: #303133;
        }
        .advice-card .advice-parent {
            font-size: 11px;
            color: #909399;
            margin-left: 6px;
        }

        .advice-card .advice-badge {
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 10px;
            font-weight: 500;
        }
        .advice-card .advice-badge.urgent { background: #fbc4c4; color: #f56c6c; }
        .advice-card .advice-badge.improve { background: #f5dab1; color: #e6a23c; }
        .advice-card .advice-badge.good { background: #c2e7b0; color: #67c23a; }

        .advice-card .advice-text {
            font-size: 13px;
            color: #606266;
            line-height: 1.8;
            white-space: pre-line;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .charts-grid { grid-template-columns: 1fr; }
            .upload-section { flex-direction: column; }
            .advice-list { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
        }

        /* 加载状态 */
        .loading-mask {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 24px;
        }
        .ai-loading {
            max-width: 600px;
            width: 100%;
        }
        .ai-loading-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        .ai-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #6366f1, #06b6d4);
            background-size: 200% 200%;
            animation: ai-pulse 1.5s ease-in-out infinite, ai-gradient-shift 3s ease infinite;
        }
        @keyframes ai-gradient-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        @keyframes ai-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.15); }
        }
        .ai-title {
            font-size: 16px;
            font-weight: 700;
            color: #303133;
            background: linear-gradient(90deg, #409EFF, #67c23a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .ai-progress-bar {
            height: 8px;
            background: #ebeef5;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 18px;
        }
        .ai-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #409EFF, #67c23a);
            border-radius: 3px;
            transition: width 0.6s ease;
        }
        .ai-steps {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .ai-step {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #c0c4cc;
            transition: color .3s;
        }
        .ai-step.active {
            color: #409EFF;
            font-weight: 600;
        }
        .ai-step.done {
            color: #67c23a;
        }
        .ai-step-dot {
            font-size: 10px;
            width: 22px;
            text-align: center;
            flex-shrink: 0;
        }
        .ai-step.done .ai-step-dot {
            color: #67c23a;
        }
        .ai-step-dot.spinning {
            display: inline-block;
            color: #6366F1;
            animation: ai-spin 1s linear infinite;
        }
        @keyframes ai-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .hidden { display: none !important; }

        /* 操作按钮区 */
        .action-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all .3s;
            text-decoration: none;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover { background: #337ecc; }
        .btn-outline {
            background: #fff;
            color: var(--primary);
            border: 1px solid var(--primary);
        }
        .btn-outline:hover { background: #ecf5ff; }
        .btn-default {
            background: #fff;
            color: #606266;
            border: 1px solid #dcdfe6;
        }
        .btn-default:hover { color: var(--primary); border-color: var(--primary); }

        /* 应用介绍 */
        .intro-section {
            text-align: center;
            padding: 48px 24px;
        }
        .intro-section .intro-icon {
            font-size: 56px;
            margin-bottom: 16px;
        }
        .intro-section h2 {
            font-size: 26px;
            color: #303133;
            margin-bottom: 8px;
        }
        .intro-section .desc {
            font-size: 15px;
            color: #909399;
            max-width: 600px;
            margin: 0 auto 24px;
            line-height: 1.7;
        }
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px,1fr));
            gap: 16px;
            max-width: 800px;
            margin: 0 auto;
        }
        .feature-item {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 1px 4px rgba(0,0,0,.06);
        }
        .feature-item .feat-icon { font-size: 28px; margin-bottom: 8px; }
        .feature-item .feat-title { font-size: 14px; font-weight: 600; color: #303133; }
        .feature-item .feat-desc { font-size: 12px; color: #909399; margin-top: 4px; }

        .student-info {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            padding: 12px 0;
            font-size: 14px;
            color: #606266;
        }
        .student-info .info-item {
            display: flex;
            gap: 6px;
        }
        .student-info .info-label { color: #909399; }
        .student-info .info-val { font-weight: 600; color: #303133; }

        /* 筛选选项卡 */
        .filter-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .filter-tab {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid #dcdfe6;
            background: #fff;
            color: #606266;
            transition: all .3s;
        }
        .filter-tab:hover { color: var(--primary); border-color: var(--primary); }
        .filter-tab.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- 顶部导航 -->
        <header class="app-header">
            <div class="logo-area">
                <img class="logo-img" src="logo.png" alt="美羊AI">
            </div>
        </header>

        <main class="app-main">
            <!-- 上传区域 -->
            <div class="card" id="uploadCard">
                <div class="card-title">美羊学习力报告AI辅助解读工具</div>
                <p style="color:#909399;font-size:13px;margin-bottom:16px;">请上传学生学习力综合测评报告，暂不支持其他类型报告解析。分析内容由AI生成，仅供参考，请仔细甄别。</p>
                <div class="upload-section" style="justify-content:center;" v-show="!resultReady">
                    <div class="upload-box" :class="{'has-file': pdfFile}" @click="triggerPdfUpload" @dragover.prevent @drop.prevent="onPdfDrop" style="max-width:480px;">
                        <div class="icon">📄</div>
                        <div class="text" v-if="!pdfFile">点击上传学习力综合测评报告<br><small>或拖拽文件到此处</small></div>
                        <div class="text" v-else>报告已就绪</div>
                        <div class="file-name" v-if="pdfFile">{{ pdfFile.name }}</div>
                        <input type="file" ref="pdfInput" accept=".pdf" style="display:none" @change="onPdfSelect">
                    </div>
                </div>
                <div class="action-bar" style="margin-top:16px;">
                    <button class="btn btn-primary" @click="startAnalyze" :disabled="(!pdfFile && !resultReady) || analyzing">
                        {{ analyzing ? 'AI 分析中...' : (resultReady ? 'AI 重新解析' : 'AI 智能分析') }}
                    </button>
                    <button class="btn btn-default" @click="resetAll" :disabled="analyzing">{{ resultReady ? '解读下一份' : '重置' }}</button>


                </div>
                <div v-if="analyzing" class="loading-mask">
                    <div class="ai-loading">
                        <div class="ai-loading-header">
                            <span class="ai-icon"></span>
                            <span class="ai-title">AI 智能分析中</span>
                        </div>
                        <div class="ai-progress-bar">
                            <div class="ai-progress-fill" :style="{width: ((aiStep+1)/aiSteps.length*100)+'%'}"></div>
                        </div>
                        <div class="ai-steps">
                            <template v-for="(s, idx) in aiSteps" :key="idx">
                                <div v-if="idx === aiStep" class="ai-step active">
                                    <span class="ai-step-dot spinning">◌</span>
                                    <span class="ai-step-label">{{ s }}</span>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
                <div v-if="parseError" style="color:#f56c6c;margin-top:12px;">{{ parseError }}</div>
            </div>

            <!-- 结果区域 -->
            <template v-if="resultReady">
                <!-- 学生信息卡片 -->
                <div class="card" v-if="studentInfo.name">
                    <div class="card-title">学生信息</div>
                    <div class="student-info">
                        <div class="info-item"><span class="info-label">姓名：</span><span class="info-val">{{ studentInfo.name }}</span></div>
                        <div class="info-item"><span class="info-label">年级：</span><span class="info-val">{{ studentInfo.grade }}</span></div>
                        <div class="info-item"><span class="info-label">学校：</span><span class="info-val">{{ studentInfo.school }}</span></div>
                        <div class="info-item" v-if="studentInfo.city"><span class="info-label">城市：</span><span class="info-val">{{ studentInfo.city }}</span></div>
                        <div class="info-item"><span class="info-label">测评日期：</span><span class="info-val">{{ studentInfo.date }}</span></div>
                    </div>
                </div>

                <!-- 综合总结 -->
                <div class="card" v-if="summaryText">
                    <div class="summary-card">
                        <div class="summary-title">{{ studentInfo.name || '学生' }}的学习力综合画像</div>
                        <div style="white-space:pre-line;">{{ summaryText }}</div>
                    </div>
                </div>

                <!-- 概览统计 -->
                <div class="card">
                    <div class="card-title">测评概览</div>
                    <div class="stats-grid">
                        <div class="stat-card primary clickable" @click="navTo('dimTable','all')">
                            <div class="num">{{ totalDimensions }}</div>
                            <div class="label">测评维度总数</div>
                        </div>
                        <div class="stat-card danger clickable" @click="navTo('advice','urgent')">
                            <div class="num">{{ urgentCount }}</div>
                            <div class="label">急需提升</div>
                        </div>
                        <div class="stat-card warning clickable" @click="navTo('advice','improve')">
                            <div class="num">{{ improveCount }}</div>
                            <div class="label">有待提升</div>
                        </div>
                        <div class="stat-card success clickable" @click="navTo('advice','good')">
                            <div class="num">{{ goodCount }}</div>
                            <div class="label">继续保持</div>
                        </div>
                        <div class="stat-card primary clickable" @click="navTo('charts')">
                            <div class="num">{{ overallScore.toFixed(1) }}</div>
                            <div class="label">综合均分</div>
                        </div>
                        <div class="stat-card clickable" @click="navTo('charts')">
                            <div class="num">{{ overallAvg.toFixed(1) }}</div>
                            <div class="label">常模均分</div>
                        </div>
                    </div>
                </div>

                <!-- 各维度详细数据 -->
                <div class="card" ref="dimTable">
                    <div class="card-title">28维度详细分析</div>
                    <div class="filter-tabs">
                        <span class="filter-tab" :class="{active: dimFilter==='all'}" @click="dimFilter='all'">全部</span>

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const { createApp } = Vue;
        const { ElMessage } = ElementPlus;

        const app = createApp({
            data() {
                return {
                    pdfFile: null,
                    analyzing: false,
                    parseError: '',
                    resultReady: false,
                    aiStep: 0,
                    aiSteps: ['正在读取PDF报告', '正在解析学生信息', '正在提取28维度数据', '正在生成诊断分析', '正在生成辅导建议'],
                    studentInfo: { name:'', grade:'', school:'', city:'', date:'' },
                    dimensions: [],
                    dimFilter: 'all',
                    dimSort: { key: '', order: 'desc' },
                    adviceFilter: 'all',
                    chartCat: '动力',
                    categoryRadarCat: '动力',
                    showBackTop: false,
                };
            },
            computed: {
                totalDimensions() { return this.dimensions.length; },
                urgentDimensions() { return this.dimensions.filter(d => d.status === 'urgent'); },
                improveDimensions() { return this.dimensions.filter(d => d.status === 'improve'); },
                goodDimensions() { return this.dimensions.filter(d => d.status === 'good'); },
                urgentCount() { return this.urgentDimensions.length; },
                improveCount() { return this.improveDimensions.length; },
                goodCount() { return this.goodDimensions.length; },
                overallScore() {
                    if (this.dimensions.length===0) return 0;
                    return this.dimensions.reduce((s,d)=>s+d.score,0)/this.dimensions.length;
                },
                overallAvg() {
                    if (this.dimensions.length===0) return 0;
                    return this.dimensions.reduce((s,d)=>s+d.avg,0)/this.dimensions.length;
                },
                summaryText() {
                    if (this.dimensions.length === 0) return '';
                    const name = this.studentInfo.name || '孩子';
                    const score = this.overallScore;
                    const avg = this.overallAvg;
                    const gap = score - avg;
                    const urgentDims = this.urgentDimensions.map(d => d.name);
                    const goodDims = this.goodDimensions.map(d => d.name);
                    const urgCount = this.urgentCount;
                    const impCount = this.improveCount;
                    const gdCount = this.goodCount;

                    let parts = [];

                    // 开篇总评
                    if (Math.abs(gap) < 1) {
                        parts.push(`${name}的综合学习力处于常模平均水平（均分${score.toFixed(1)}，常模${avg.toFixed(1)}），各项能力发展比较均衡。`);
                    } else if (gap > 0) {
                        const adj = gap > 1 ? '明显高于' : '略高于';
                        parts.push(`${name}的综合均分（${score.toFixed(1)}）${adj}常模水平（${avg.toFixed(1)}），整体学习力表现不错，是个很好的起点。`);
                    } else {
                        const adj = gap < -0.8 ? '与常模有一定差距' : '略低于常模';
                        parts.push(`${name}的综合均分（${score.toFixed(1)}）${adj}（常模${avg.toFixed(1)}），还有不少进步空间，但别担心，成长比现状更重要。`);
                    }

                    // 分布总览
                    const distributionClues = [];
                    if (urgCount > 0) distributionClues.push(`${urgCount}项急需提升`);
                    if (impCount > 0) distributionClues.push(`${impCount}项有待提升`);
                    if (gdCount > 0) distributionClues.push(`${gdCount}项保持优势`);
                    parts.push(`在28个测评维度中，${distributionClues.join('、')}。`);

                    // 亮点
                    if (goodDims.length >= 3) {
                        parts.push(`${name}在「${goodDims.slice(0, 3).join('」「')}」等维度上表现突出，这些是ta的学习优势区，值得肯定和鼓励。`);
                    } else if (goodDims.length > 0) {
                        parts.push(`${name}在「${goodDims.join('」「')}」方面表现不错，继续保持就好。`);
                    }

                    // 待提升方向
                    if (urgCount >= 3) {
                        parts.push(`需要重点关注的是「${urgentDims.slice(0, 3).join('」「')}」等维度的提升，建议参考下方的个性化辅导建议，从最触手可及的一项开始，循序渐进。`);
                    } else if (urgCount > 0) {
                        parts.push(`目前最需要关注的是「${urgentDims.join('」「')}」，好在数量不多，集中精力攻坚会有明显效果。`);
                    } else if (impCount > 0) {
                        parts.push(`虽然没有红色预警的维度，但部分维度仍有提升空间，稳扎稳打就好。`);
                    }

                    // 鼓励结尾 —— 先查找学生数据命中哪些天然维度关联对，再生成针对性的句子
                    const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

                    // 所有弱项维度（红色+橙色）

                    // 天然维度关联对：A（高）→ B（低），附带因果解释
                    const NATURAL_PAIRS = [
                        { high: '学习兴趣', low: '注意集中', explain: '兴趣是注意力的发动机。${name}对学科有兴趣，说明ta不是做不到专注，只是在需要专注的时候少了一个"启动器"——而兴趣正好就是那个启动器。' },
                        { high: '自我效能感', low: '计划策略', explain: '${name}相信自己能学好，这种"我能行"的感觉其实已经为制定学习计划打好了心理基础。下一步就是把这份信心落到纸面上：哪怕只是每天写一个"今天要搞定的一件事"，都是好的开始。' },
                        { high: '成长型思维', low: '调节策略', explain: '${name}相信努力可以改变能力，这本身就是调节策略的底层信念。因为只有当ta觉得"换种方法会更好"时，ta才会主动去调整——而这个信念，ta已经有了。' },
                        { high: '情绪管理', low: '考试环节', explain: '考场上的失常，很多时候不是不会做，而是被情绪盖住了。${name}的情绪管理能力不错，这是一个非常宝贵的资源——考试时，试着让ta用管理情绪的方法来稳住考场心态，效果会很直接。' },
                        { high: '学业压力管理', low: '注意集中', explain: '学业压力会无声地消耗注意力——就像后台开着太多应用，手机自然会卡。${name}能把压力管理好，就相当于已经关掉了一批不必要的后台，再去提升注意力就轻松多了。' },
                        { high: '学习意义', low: '精细加工策略', explain: '一个理解了"为什么要学"的人，更容易在学的时候主动追问"这个知识是怎么来的"。${name}对学习意义有感觉，这个感觉恰恰是深入加工知识的最强助推器。' },
                        { high: '自我认知', low: '大学职业认知', explain: '${name}很清楚自己擅长什么、什么状态更高效——这份自知是规划未来的第一步。从这个切入点出发，帮ta把对自己已有的了解，慢慢延伸到"将来可能适合做什么"，就顺理成章了。' },
                        { high: '计划策略', low: '时间管理', explain: '计划是时间的骨架。${name}善于做计划，说明ta脑子里已经有了"先做什么、后做什么"的框架，把这个框架从纸上搬到每天的时间表里，就是时间管理。' },
                        { high: '监控策略', low: '调节策略', explain: '${name}能察觉到自己走神了、学不进去了——这个"觉察"本身就是一大步。调节策略需要的就是这种觉察：先知道哪里不对，再想办法调整。ta已经完成了最难的前半段。' },
                        { high: '精细加工策略', low: '系统思维', explain: '精细加工的本质是把零散的知识点串成线、织成网——这正是系统思维的雏形。${name}在精加工上已经有意识了，继续往下深挖，系统思维自然会慢慢长出来。' },
                        { high: '组织策略', low: '资料管理策略', explain: '善于梳理知识框架的人，整理笔记和资料往往也很在行——因为这两件事用的其实是同一套"分类、归纳、建立结构"的底层能力。${name}只需要把这一套能力有意识地迁移到资料整理上。' },
                        { high: '复述策略', low: '听课环节', explain: '${name}习惯于用自己的话把学过的东西重新讲一遍，这个习惯如果也用到听课中——边听边在心里做"翻译"，听课的理解效率会明显提高。' },
                        { high: '时间管理', low: '精力管理', explain: '${name}的时间安排有章法了，接下来可以在这个基础上加一层"精力匹配"——把最烧脑的任务安排在自己精力最旺盛的时段。时间是容器，精力才是内容。' },
                        { high: '注意集中', low: '练习环节', explain: '注意力是练习的质量保障。${name}的注意力集中度不错，把这个优势聚焦到练习中，哪怕每天只练一小段时间，效果都会比长时间低效练习好得多。' },
                        { high: '系统思维', low: '批判思维', explain: '系统思维和批判思维像一对双生兄弟——能看清楚整体结构的人，才更容易发现结构中不合理的细节。${name}的前者已经上路了，后者就在不远处。' },
                        { high: '电子产品管理', low: '注意集中', explain: '能主动管住手机的孩子，已经拿到了注意力管理最难的入场券。${name}的电子管理做得好，说明ta的自控力基础是有的，接下来就是把这份自控力辐射到更广泛的专注场景中去。' },
                        { high: '听课环节', low: '练习环节', explain: '${name}的课堂吸收效率不错，这是很占便宜的一个能力。课堂理解了80%，练习就是巩固和延伸；课堂只听懂50%，练习就要花三倍时间去补。利用好这个效率差，进步会很显著。' },
                        { high: '环境管理策略', low: '注意集中', explain: '${name}知道给自己营造安静、有序的学习环境，这说明ta对"什么条件能让自己进入状态"有真实的体感。用好这个体感，在需要高度专注的时候创造条件给自己，就是最省力的提升方式。' },
                        { high: '人际管理策略', low: '学业压力管理', explain: '${name}碰到问题愿意找老师同学帮忙——这其实是压力管理里最有效的一招：把压力说出来。如果能把"求助"也作为一种主动减压的习惯来培养，学业压力会有明显缓解。' },
                        { high: '调节策略', low: '精力管理', explain: '懂得根据状态调整学习方法的人，其实已经在做精力管理了。${name}会调节策略，下一步就是把这种"状态感知+灵活调整"的能力有意识地和精力曲线匹配起来。' },
                        { high: '创新思维', low: '批判思维', explain: '创新和批判往往是联动的：敢于想"为什么一定是这样"，才会有"可不可以换一种做法"。${name}的创新思维已经有了苗头，再多问一个"为什么"，批判思维就会被带动起来。' },
                        { high: '学习兴趣', low: '学业压力管理', explain: '真正对学习本身感兴趣的人，在面对考试和成绩时心态容易更稳——因为ta的动力来自内在，而不完全依赖外界的评判。${name}的学习兴趣就是ta最好的压力缓冲垫。' },
                        { high: '自我效能感', low: '学业压力管理', explain: '相信自己能学好的人，面对压力时的第一反应不是"我完了"，而是"我再想想办法"。${name}的自我效能感已经为ta提供了一种天然的减压机制——只要把这个信念带入压力场景，焦虑自然会减轻。' },
                        { high: '自我效能感', low: '考试环节', explain: '考试很大程度上是一场信心的博弈。${name}相信自己能做好，这份信念在考场上比多做十道题更有用——因为它决定了ta拿到不会的题时，是放弃还是再试一次。' },
                        { high: '成长型思维', low: '注意转移', explain: '相信"能力可以改变"的人，更容易在遇到瓶颈时主动换个角度、换种方法。${name}的成长型思维是注意转移的最佳燃料——因为ta相信换一条路也能到达目的地。' },
                        { high: '成长型思维', low: '练习环节', explain: '成长型思维的人眼中的练习不是重复，而是"每次都在变好一点点"。${name}已经有了这个最底层的信念，把练习从"完成任务"变成"积累进步"，效果会大不一样。' },
                        { high: '时间管理', low: '练习环节', explain: '会管理时间的人，永远留得出"练"的时间。${name}的时间管理能力不错，接下来就是把练习当作时间表上的优先事项——不需要多，每天固定20分钟就够。' },
                        { high: '情绪管理', low: '人际管理策略', explain: '能管理好自己的情绪，就更容易理解别人的情绪——这是人际交往的核心能力。${name}的情绪管理已经在为ta的人际关系铺路了，接下来只需要有意识地把这份觉察用在和老师、同学的互动中。' },
                        { high: '自我认知', low: '注意转移', explain: '知道自己什么状态下学得进去、什么状态下学不进去，这是注意力管理的第一步。${name}的自我认知很清晰，把这份了解用到注意力的自我调节上——"我现在累了，换一科轻松的先做"——就成了注意转移。' },
                        { high: '复述策略', low: '精细加工策略', explain: '复述是把知识记住的第一步，精细加工是把知识理解透的下一步。${name}已经习惯了用复述来巩固，再往前走一小步：在复述的时候问自己一句"这跟我知道的什么有关系？"，精细加工就自然启动了。' },
                        { high: '计划策略', low: '监控策略', explain: '会做计划的人，天然就适合做监控——因为计划就是监控的参照物。${name}把计划做好了，只需要在执行中多一步"看看进度跟计划差多少"，监控能力就顺带练出来了。' },
                        { high: '调节策略', low: '练习环节', explain: '懂得根据状态调整方法的人，在练习中最容易找到"性价比最高"的训练方式。${name}会调节策略，在练习时就可以有意识地问自己"这个方法有效吗？要不要换一种？"——这样练一次，顶别人练三次。' },
                        { high: '环境管理策略', low: '精力管理', explain: '了解什么环境能让自己更专注的人，其实已经在做精力管理了。${name}会主动管理学习环境，接下来只需要把这个逻辑延伸到时间上——在精力最好的时段安排最难的事，就是最高级的精力管理。' },
                        { high: '学习意义', low: '大学职业认知', explain: '一个真正理解"为什么学"的人，更容易想清楚"将来想做什么"。${name}对学习意义的感知是职业认知的指南针——从"学这些有什么用"出发，慢慢过渡到"学了这些我可以成为什么样的人"。' },
                        { high: '注意集中', low: '注意转移', explain: '能集中注意力和能转移注意力，其实是同一块肌肉的两种用法。${name}的集中力已经有了，现在只需要练习"主动收放"——在需要时深扎进去，在需要时利落地抽出来换下一件事。' },
                        { high: '系统思维', low: '创新思维', explain: '能把零散知识串成体系的人，最容易在体系中发现裂缝、找到新可能。${name}的系统思维是创新最好的土壤——创新从来不是凭空出现，而是在已有结构上长出来的新枝。' },
                        { high: '组织策略', low: '精细加工策略', explain: '善于对知识分类归纳的人，在深入加工时天然就有优势——因为材料已经整理好了，剩下的就是往里面"钻"。${name}的组织能力为精细加工铺好了路，只需要再追问一层"所以呢？"。' },
                        { high: '听课环节', low: '注意转移', explain: '会听课的人懂得在听讲中灵活切换注意力——从听老师讲到记笔记，从思考问题到听同学回答。${name}的听课效率不错，把这种灵活的注意力切换有意识地延伸到自习中去，效果会很明显。' },
                        { high: '人际管理策略', low: '情绪管理', explain: '善于和老师同学沟通的孩子，在情绪上通常也有更多出口——因为倾诉本身就是最好的情绪调节。${name}的人际关系是ta情绪管理的一张安全网，鼓励ta在情绪不好的时候主动找人聊一聊。' },
                        { high: '资料管理策略', low: '时间管理', explain: '资料整理得井井有条的人，花在"找东西"上的时间就少——省出来的时间就是最直接的"时间管理"。${name}的资料管理习惯已经在为ta节省时间了，再往前一步：把资料管理和任务优先级结合起来，就是完整的时间管理。' },
                        { high: '学业压力管理', low: '情绪管理', explain: '能把学业压力处理好的人，往往已经无意识地掌握了很多情绪调节的方法。${name}在压力管理上有自己的办法，现在只需要把这些办法"命名"一下，让ta知道"原来我在用这个方法调节情绪"，就可以有意识地迁移到更广泛的情绪场景中。' },
                        { high: '考试环节', low: '学业压力管理', explain: '考试经验本身是缓解考试焦虑最好的药——经历得多了，考场就不再是未知的战场。${name}如果把每次考试都当作一次"压力排练"，考完之后复盘一下"这次紧张在哪里、下次怎么应对"，学业压力管理能力会随考试次数自然增长。' },
                        { high: '注意集中', low: '听课环节', explain: '注意力是课堂效率的第一保障。${name}的专注力不错，只要在听课前做一个简单的"状态预设"——"接下来40分钟，我的任务就是跟上老师的思路"——听课效果就会明显再上一个台阶。' },
                        { high: '自我效能感', low: '人际管理策略', explain: '相信自己的人，在人际交往中更敢开口、更不怕被拒绝。${name}的自我效能感是ta社交信心的底气，鼓励ta在遇到学习困难时主动找老师同学讨论——ta有这个能力，只是需要多试几次。' },
                        { high: '情绪管理', low: '练习环节', explain: '情绪稳定的人，练习效率最高——因为ta不会因为一次做错就否定自己，也不会因为烦躁而中途放弃。${name}的情绪管理能力是练习质量的稳定器，把这个优势带到练习中，会有事半功倍的效果。' },
                        { high: '学习意义', low: '复述策略', explain: '当一个人清楚"为什么要学"时，复述就不再是枯燥的重复，而是有意义的回顾和整理。${name}的学习意义感可以为复述注入动力——在复述时想一想"这个知识点到底在说什么"，枯燥感会大大降低。' },
                        { high: '学习兴趣', low: '复述策略', explain: '感兴趣的内容，不需要刻意重复也能记住。${name}可以把"兴趣"和"复述"结合起来——在复习自己感兴趣的科目时多用复述，体验"因为喜欢所以记得住"的正向循环，再把这种感觉迁移到其他科目上。' },
                        { high: '时间管理', low: '资料管理策略', explain: '时间越紧，资料整理越重要——找一张卷子花十分钟，就是对时间管理最大的消解。${name}的时间管理意识已经有了，配套把资料分门别类整理好，每找一份资料省下的几分钟，积累下来就是一大块学习时间。' },
                        { high: '电子产品管理', low: '时间管理', explain: '能管住手机的人，天然就已经赢得了时间管理的半场胜利——因为时间最大的敌人往往就是"再刷五分钟"。${name}在电子管理上的自控力，恰恰是时间管理最需要的那种"说停就停"的能力。' },
                        { high: '电子产品管理', low: '练习环节', explain: '管理好电子产品，腾出来的不只是时间，还有完整的不被打断的练习块。${name}已经证明了ta能管住自己，接下来就是把"不被手机打断的时间"直接划给练习——哪怕每天只划出20分钟，效果也比碎片化练习好得多。' },
                        { high: '监控策略', low: '注意转移', explain: '能察觉到自己走神了，就是注意转移的第一步——因为你得先"知道"自己走神了，才能"主动"把注意力拉回来。${name}的监控能力让ta在学习中始终保持着一种觉察，接下来的练习就是：觉察到走神→不自责→温和地把注意力放回正事上。' },
                        { high: '精细加工策略', low: '批判思维', explain: '精细加工的本质是追问"为什么"和"这意味着什么"——这恰恰是批判性思维的起点。${name}在精加工时已经有了追问的习惯，再多向前一步："这个说法有证据吗？有没有别的可能？"，批判思维就自然长出来了。' },
                        { high: '组织策略', low: '复述策略', explain: '经过分类和归纳的知识，复述效率会高得多——因为脑子里已经有了"抽屉"，每个知识点放在哪个抽屉里清清楚楚。${name}的组织能力为复述搭建了书架，接下来只需要把书从书架上拿下来读一遍，就是高效复述。' },
                        { high: '环境管理策略', low: '练习环节', explain: '好的学习环境是高质量练习的隐形推手——在一个安静整洁的环境里练习，专注成本天然就低。${name}懂得为自己创造好环境，把这个优势延伸到练习中：每次练习前先花两分钟把桌面清空、把干扰源关掉，练习质量会肉眼可见地提升。' },
                        { high: '情绪管理', low: '注意转移', explain: '情绪会影响注意力的方向——焦虑时容易被负面信息吸引，平静时更容易主动切换任务。${name}的情绪管理能力是注意转移的遥控器，当ta发现自己陷在某道题里出不来时，先做一个深呼吸调整情绪，再告诉自己"先放一放，做下一题"，注意转移就完成了。' },
                        { high: '复述策略', low: '考试环节', explain: '考试考的不是"会不会"，而是"在限定时间内能不能想起来"。复述策略就是最好的"提取练习"——平时复述得越多，考试时提取的速度就越快。${name}坚持做复述，就是在为考场的"快速提取"积累经验，到考试时自然能调动出来。' },

                resetAll() {

                    this.dimensions = [];

                    this.dimSort = { key: '', order: 'desc' };

                // 延迟辅助函数，让AI动画步骤有节奏感
                sleep(ms) {
                    return new Promise(resolve => setTimeout(resolve, ms));
                },

                async startAnalyze() {
                    if (!this.pdfFile || this.analyzing) return;
                    // 文件预检：格式不对则立即返回，不走进度条
                    if (this.pdfFile.type !== 'application/pdf') {
                        this.parseError = '解析失败：未能从报告中提取到数据，请确认您上传的文件是标准的学习力综合测评报告';
                        ElMessage.error(this.parseError);
                        return;
                    }
                    this.analyzing = true;
                    this.parseError = '';
                    this.resultReady = false;

                    try {
                        // 先读取PDF并快速校验内容，不合法则立即退出，不走进度条
                        const arrayBuffer = await this.pdfFile.arrayBuffer();
                        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                        let fullText = '';
                        let rawText = '';  // 原始item文本（不按行重建），用于降级匹配
                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const content = await page.getTextContent();
                            // 根据Y坐标重建行结构，避免文本粘连
                            const items = content.items;
                            let lines = [];
                            let currentY = null;
                            let currentLine = [];
                            for (const item of items) {
                                rawText += item.str;
                                const y = Math.round(item.transform[5] * 10) / 10;
                                if (currentY === null) {
                                    currentLine = [item];
                                    currentY = y;
                                } else if (Math.abs(y - currentY) < 2) {
                                    currentLine.push(item);
                                } else {
                                    if (currentLine.length > 0) {
                                        lines.push(currentLine.map(it => it.str).join(' '));
                                    }
                                    currentLine = [item];
                                    currentY = y;
                                }
                            }
                            if (currentLine.length > 0) {
                                lines.push(currentLine.map(it => it.str).join(' '));
                            }
                            fullText += lines.join('\n') + '\n';
                        }

                        // 快速校验：文本中是否包含测评维度关键词，不合法直接退出不走进度
                        const dimNames = DIMENSION_CONFIG.map(d => d.name);
                        const hitCount = dimNames.filter(n => fullText.includes(n)).length;
                        if (hitCount < 3) {
                            throw new Error('未能从报告中提取到数据，请确认您上传的文件是标准的学习力综合测评报告');
                        }

                        // 校验通过，开始走AI进度动画
                        this.aiStep = 0;
                        await this.sleep(400);
                        this.aiStep = 1;
                        await this.sleep(600);

                        // 步骤2：AI解析学生信息
                        this.aiStep = 2;
                        await this.sleep(700);
                        this.extractStudentInfo(fullText, rawText);

                        // 步骤3：AI提取28维度数据
                        this.aiStep = 3;
                        await this.sleep(700);
                        this.extractScores(fullText);

                        // 步骤4：AI生成诊断分析
                        this.aiStep = 4;
                        await this.sleep(800);
                        this.classifyDimensions();

                        this.resultReady = true;

                        // 渲染图表
                        this.$nextTick(() => {
                            this.renderCharts();
                        });

                        const sname = this.studentInfo.name || '学生';
                        ElMessage.success(`成功解读「${sname}」的测评报告！`);
                    } catch (err) {
                        console.error(err);
                        this.parseError = '解析失败：' + (err.message || '未知错误，请确认PDF格式正确');
                        ElMessage.error('解析失败，请检查报告文件');
                    } finally {
                        this.analyzing = false;
                        if (this.parseError) this.aiStep = 0;
                    }
                },

                extractStudentInfo(text, rawItemsText) {
                    // 用行首匹配，避免跨行捕获到多余内容
                    const getField = (label) => {
                        const regex = new RegExp(`${label}[：:]\\s*([^\\n]+)`, 'm');
                        const m = text.match(regex);
                        return m ? m[1].trim() : '';
                    };
                    this.studentInfo.name = getField('姓名');
                    this.studentInfo.grade = getField('年级');
                    this.studentInfo.school = getField('学校');
                    this.studentInfo.city = getField('城市');

                    // 日期提取：多种策略逐级降级
                    let dateResult = '';
                    // 策略1：完整"测评日期"（含多种Unicode变体：日U+65E5 ⽇U+2F47）
                    const p1 = /测评[日期⽇][日期⽇]?[：:]\s*([^\n]+)/m;
                    let m = text.match(p1);
                    if (m) dateResult = m[1].trim();

                    // 策略2："测评"和"日期"可能因PDF重建被拆到不同行
                    if (!dateResult) {
                        const p2 = /测评\s*\n\s*[日期⽇][日期⽇]?[：:]\s*([^\n]+)/m;
                        m = text.match(p2);
                        if (m) dateResult = m[1].trim();
                    }

                    // 策略3：仅匹配"日期"（不管前面是否有"测评"）
                    if (!dateResult) {
                        const p3 = /[日期⽇][日期⽇]?[：:]\s*([^\n]+)/m;
                        m = text.match(p3);
                        if (m) dateResult = m[1].trim();
                    }

                    // 策略4：在原始文本（不换行）中查找日期
                    if (!dateResult && rawItemsText) {
                        const p4 = /([日⽇]期)[：:]?\s*(\d{4}[年.\-/]\d{1,2}[月.\-/]\d{1,2}[日號]?)/;
                        m = rawItemsText.match(p4);
                        if (m) dateResult = m[2].trim();
                    }

                    // 策略5：全文查找日期格式（YYYY-MM-DD 或 YYYY年MM月DD日）
                    if (!dateResult) {
                        const p5 = /(20\d{2}[年.\-/]\d{1,2}[月.\-/]\d{1,2}[日號]?)/;
                        m = text.match(p5);
                        if (m) dateResult = m[1].trim();
                    }

                    this.studentInfo.date = dateResult;
                    console.log('[日期提取] 结果:', dateResult || '(未找到)');
                },

                extractScores(text) {
                    // 方法1：查找所有"我的得分：X.X分"和"平均得分：X.X分"的配对
                    const scorePattern = /我的得分[：:]\s*([\d.]+)分[\s\S]*?平均得分[：:]\s*([\d.]+)分/g;
                    const matches = [];
                    let match;
                    while ((match = scorePattern.exec(text)) !== null) {
                        matches.push({
                            score: parseFloat(match[1]),
                            avg: parseFloat(match[2])
                        });
                    }

                    console.log('找到', matches.length, '组分数数据');

                    if (matches.length >= 28) {
                        // 按照PDF顺序匹配到28个维度
                        this.dimensions = DIMENSION_CONFIG.map((config, index) => ({
                            ...config,
                            score: matches[index].score,
                            avg: matches[index].avg,
                            diff: matches[index].score - matches[index].avg,
                            status: ''
                        }));
                    } else if (matches.length > 0) {
                        // 分数不够28个，尝试逐个单独提取
                        const individualPattern = /我的得分[：:]\s*([\d.]+)分/g;
                        const avgPattern = /平均得分[：:]\s*([\d.]+)分/g;
                        const scores = [...text.matchAll(individualPattern)].map(m => parseFloat(m[1]));
                        const avgs = [...text.matchAll(avgPattern)].map(m => parseFloat(m[1]));

                        const count = Math.min(DIMENSION_CONFIG.length, scores.length, avgs.length);
                        this.dimensions = DIMENSION_CONFIG.slice(0, count).map((config, i) => ({
                            ...config,
                            score: scores[i],
                            avg: avgs[i],
                            diff: scores[i] - avgs[i],
                            status: ''
                        }));
                    } else {
                        throw new Error('未能从报告中提取到数据，请确认您上传的文件是标准的学习力综合测评报告');
                    }
                },


                classifyDimensions() {
                    this.dimensions.forEach(d => {
                        const diff = d.diff;
                        if (diff < -1) {
                            d.status = 'urgent';
                        } else if (diff >= -1 && diff <= 1) {
                            d.status = 'improve';
                        } else {
                            d.status = 'good';
                        }
                    });
                },

                getStatusClass(status) {
                    if (status === 'urgent') return 'urgent';
                    if (status === 'improve') return 'improve';
                    return 'good';
                },

                catCount(catKey) {
                    return this.dimensions.filter(d => d.category && d.category.includes(catKey)).length;
                },

                getAdviceText(d) {
                    const kb = ADVICE_KB[d.name];
                    let raw = '';
                    if (kb) {
                        raw = kb[d.status] || kb.improve || '请根据得分情况制定个性化提升方案';
                    } else if (d.status === 'urgent') {
                        raw = `【急需提升】${d.name}得分(${d.score.toFixed(1)})显著低于常模均值(${d.avg.toFixed(1)})，差值为${d.diff.toFixed(1)}。建议：重点加强该维度的训练，寻找专业指导师进行针对性辅导。`;
                    } else if (d.status === 'improve') {
                        raw = `【有待提升】${d.name}得分(${d.score.toFixed(1)})接近常模均值(${d.avg.toFixed(1)})。建议：在日常学习中有意识地加强该维度的练习，逐步缩小差距。`;
                    } else {
                        raw = `【继续保持】${d.name}得分(${d.score.toFixed(1)})高于常模均值(${d.avg.toFixed(1)})。建议：继续保持并发挥带动作用。`;
                    }
                    // 清理冗余前缀，只保留建议内容
                    let cleaned = raw.replace(/^【[^】]+】/, '').trim();
                    const idx = cleaned.search(/建议[：:]/);
                    if (idx >= 0) {
                        cleaned = cleaned.substring(idx).replace(/^建议[：:]?\s*/, '');
                    }
                    // 在序号前插入换行（支持①②③④⑤⑥⑦⑧⑨⑩）
                    cleaned = cleaned.replace(/[①②③④⑤⑥⑦⑧⑨⑩]/g, '\n$&');
                    // 去掉开头的多余换行
                    cleaned = cleaned.replace(/^\n/, '');
                    return cleaned || '请根据得分情况制定个性化提升方案';
                },

                renderCharts() {
                    this.renderRadarChart();
                    this.renderCategoryRadarChart();
                    this.renderBarChart();
                    this.renderTrendChart();

                renderRadarChart() {

                        chart = echarts.init(chartDom);

                    const dimNames = this.dimensions.map(d => d.name);
                    const scores = this.dimensions.map(d => d.score);
                    const avgs = this.dimensions.map(d => d.avg);

                    const option = {
                        animation: true,
                        animationDuration: 1200,
                        animationEasing: 'cubicOut',
                        animationDelay: (idx) => idx * 30,
                        tooltip: { show: false },
                        legend: { show: false },
                        radar: {
                            center: ['50%', '48%'],
                            radius: '68%',
                            indicator: dimNames.map(n => ({ name: n, max: 10 })),
                            axisName: {
                                fontSize: 8,
                                lineHeight: 12,
                                formatter: (name) => {
                                    const idx = dimNames.indexOf(name);
                                    if (idx < 0) return name;
                                    const sc = scores[idx].toFixed(1);
                                    const av = avgs[idx].toFixed(1);
                                    return `{dim|${name}}{bk|(}{sv|${sc}}{sep||}{av|${av}}{bk|)}`;
                                },
                                rich: {
                                    dim: { fontSize: 8, color: '#606266', lineHeight: 12 },
                                    bk: { fontSize: 8, color: '#909399', lineHeight: 12 },
                                    sv: { fontSize: 7, color: '#6366F1', lineHeight: 12 },
                                    sep: { fontSize: 7, color: '#909399', lineHeight: 12 },
                                    av: { fontSize: 7, color: '#F59E0B', lineHeight: 12 }
                                }
                            },
                            splitArea: {
                                areaStyle: { color: ['rgba(99,102,241,0.02)', 'rgba(99,102,241,0.04)', 'rgba(99,102,241,0.02)', 'rgba(99,102,241,0.04)', 'rgba(99,102,241,0.02)'] }
                            }
                        },
                        series: [{
                            name: '学习力维度',
                            type: 'radar',
                            data: [
                                {
                                    value: scores,
                                    name: '学生得分',
                                    lineStyle: { color: '#6366F1', width: 2.5 },
                                    areaStyle: { color: 'rgba(99,102,241,0.2)' },
                                    itemStyle: { color: '#6366F1' },
                                    symbol: 'circle',
                                    symbolSize: 5,
                                },
                                {
                                    value: avgs,
                                    name: '常模均值',
                                    lineStyle: { color: '#F59E0B', width: 2, type: 'dashed' },
                                    areaStyle: { color: 'rgba(245,158,11,0.08)' },
                                    itemStyle: { color: '#F59E0B' },
                                    symbol: 'diamond',
                                    symbolSize: 4,
                                }
                            ]
                        }]
                    };
                    chart.setOption(option, true);
                    // 点击雷达外圈显示对应数据
                },

                renderCategoryRadarChart() {
                    const chartDom = document.getElementById('categoryRadarChart');
                    if (!chartDom) return;
                    let chart = echarts.getInstanceByDom(chartDom);
                    if (!chart) {
                        chart = echarts.init(chartDom);
                        window.addEventListener('resize', () => chart.resize());
                    }

                    // 根据当前选中的分类，筛选该分类的所有维度
                    const catKey = this.categoryRadarCat;
                    const dims = this.dimensions.filter(d => d.category && d.category.includes(catKey));
                    if (dims.length === 0) return;

                    const dimNames = dims.map(d => d.name);
                    const scores = dims.map(d => d.score);
                    const avgs = dims.map(d => d.avg);

                    const catLabels = { '动力': '学习动力', '策略': '学习策略', '习惯': '学习习惯' };
                    const catColors = { '动力': '#6366F1', '策略': '#10B981', '习惯': '#F59E0B' };
                    const catFills = { '动力': 'rgba(99,102,241,0.2)', '策略': 'rgba(16,185,129,0.2)', '习惯': 'rgba(245,158,11,0.2)' };
                    const c = catColors[catKey] || '#6366F1';
                    const fill = catFills[catKey] || 'rgba(99,102,241,0.2)';

                    const option = {
                        tooltip: { show: false },
                        legend: { show: false },
                        radar: {
                            center: ['50%', '48%'],
                            radius: '68%',
                            indicator: dimNames.map(n => ({ name: n, max: 10 })),
                            axisName: {
                                fontSize: 8,
                                lineHeight: 12,
                                formatter: (name) => {
                                    const idx = dimNames.indexOf(name);
                                    if (idx < 0) return name;
                                    const sc = scores[idx].toFixed(1);
                                    const av = avgs[idx].toFixed(1);
                                    return `{dim|${name}}{bk|(}{sv|${sc}}{sep||}{av|${av}}{bk|)}`;
                                },
                                rich: {
                                    dim: { fontSize: 8, color: '#606266', lineHeight: 12 },
                                    bk: { fontSize: 8, color: '#909399', lineHeight: 12 },
                                    sv: { fontSize: 7, color: c, lineHeight: 12 },
                                    sep: { fontSize: 7, color: '#909399', lineHeight: 12 },
                                    av: { fontSize: 7, color: '#94A3B8', lineHeight: 12 }
                                }
                            },
                            splitArea: {
                                areaStyle: { color: ['rgba(99,102,241,0.02)', 'rgba(99,102,241,0.04)', 'rgba(99,102,241,0.02)', 'rgba(99,102,241,0.04)', 'rgba(99,102,241,0.02)'] }
                            }
                        },
                        series: [{
                            name: catLabels[catKey] || '分类维度',
                            type: 'radar',
                            data: [
                                {
                                    value: scores,
                                    name: '学生得分',
                                    lineStyle: { color: c, width: 2.5 },
                                    areaStyle: { color: fill },
                                    itemStyle: { color: c },
                                    symbol: 'circle',
                                    symbolSize: 5,
                                },
                                {
                                    value: avgs,
                                    name: '常模均值',
                                    lineStyle: { color: '#94A3B8', width: 2, type: 'dashed' },
                                    areaStyle: { color: 'rgba(148,163,184,0.08)' },
                                    itemStyle: { color: '#94A3B8' },
                                    symbol: 'diamond',
                                    symbolSize: 4,
                                }
                            ]
                        }]
                    };
                    chart.setOption(option, true);
                    // 点击分类雷达外圈显示对应数据
                },

                renderBarChart() {
                    const chartDom = document.getElementById('barChart');
                    if (!chartDom) return;
                    let chart = echarts.getInstanceByDom(chartDom);
                    if (!chart) {
                        chart = echarts.init(chartDom);
                        window.addEventListener('resize', () => chart.resize());
                    }
                    const data = this.chartDimensions;

                    const option = {
                        tooltip: {
                            trigger: 'axis',
                            axisPointer: { type: 'shadow' },
                            formatter: (params) => {
                                const d = data[params[0].dataIndex];
                                let html = `<strong>${d.name}</strong>（${d.parent}）<br/>`;
                                params.forEach(p => {
                                    html += `${p.marker} ${p.seriesName}: ${p.value.toFixed(1)}<br/>`;
                                });
                                html += `差值: ${d.diff >= 0 ? '+' : ''}${d.diff.toFixed(1)}`;
                                return html;
                            }
                        },
                        legend: {
                            data: ['学生得分', '常模均值'],
                            top: 0,
                        },
                        grid: { left: 60, right: 20, top: 40, bottom: 80 },
                        xAxis: {
                            type: 'category',
                            data: data.map(d => d.name),
                            axisLabel: { rotate: 45, fontSize: 10, interval: 0 },
                        },
                        yAxis: {
                            type: 'value',
                            name: '得分',
                            min: 0,
                            max: 10,
                            interval: 1,
                        },
                        series: [
                            {
                                name: '学生得分',
                                type: 'bar',
                                data: data.map(d => ({
                                    value: d.score,
                                    itemStyle: {
                                        color: d.status === 'urgent' ? '#f56c6c' :
                                               d.status === 'improve' ? '#e6a23c' : '#67c23a'
                                    }
                                })),
                                barWidth: 18,
                                emphasis: { itemStyle: { color: '#409EFF' } }
                            },
                            {
                                name: '常模均值',
                                type: 'bar',
                                data: data.map(d => ({
                                    value: d.avg,
                                    itemStyle: { color: '#c0c4cc' }
                                })),
                                barWidth: 18,
                                barGap: '20%',
                                itemStyle: { borderRadius: [4,4,0,0] }
                            }
                        ]
                    };
                    chart.setOption(option, true);
                },

                renderTrendChart() {
                    const chartDom = document.getElementById('trendChart');
                    if (!chartDom) return;
                    let chart = echarts.getInstanceByDom(chartDom);
                    if (!chart) {
                        chart = echarts.init(chartDom);
                        window.addEventListener('resize', () => chart.resize());
                    }
                    const data = this.chartDimensions;

                    const option = {
                        tooltip: {
                            trigger: 'axis',
                            formatter: (params) => {
                                const d = data[params[0].dataIndex];
                                return `<strong>${d.name}</strong>（${d.parent}）<br/>
                                    差值: ${d.diff >= 0 ? '+' : ''}${d.diff.toFixed(1)}<br/>
                                    学生: ${d.score.toFixed(1)} | 常模: ${d.avg.toFixed(1)}`;
                            }
                        },
                        grid: { left: 60, right: 40, top: 20, bottom: 80 },
                        xAxis: {
                            type: 'category',
                            data: data.map(d => d.name),
                            axisLabel: { rotate: 45, fontSize: 10, interval: 0 },
                        },
                        yAxis: {
                            type: 'value',
                            name: '差值',
                            axisLabel: { formatter: '{value}' }
                        },
                        series: [{
                            name: '差值（得分-均值）',
                            type: 'bar',
                            data: data.map(d => ({
                                value: parseFloat(d.diff.toFixed(1)),
                                itemStyle: {
                                    color: d.diff > 1 ? '#67c23a' :
                                           d.diff < -1 ? '#f56c6c' : '#e6a23c'
                                }
                            })),
                            markLine: {
                                data: [
                                    { yAxis: 1, label: { formatter: '超常模1分' }, lineStyle: { color: '#67c23a', type: 'dashed' } },
                                    { yAxis: -1, label: { formatter: '低常模1分' }, lineStyle: { color: '#f56c6c', type: 'dashed' } },
                                    { yAxis: 0, label: { formatter: '常模线' }, lineStyle: { color: '#909399', type: 'solid' } }
                                ],
                                silent: false,
                            }
                        }]
                    };
                    chart.setOption(option, true);
                },
            },
            mounted() {
                window.addEventListener('scroll', this.handleScroll);
            },
            beforeUnmount() {
                window.removeEventListener('scroll', this.handleScroll);
            }
        });

        app.use(ElementPlus);
        app.mount('#app');
    </script>
</body>
</html>
